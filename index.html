<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Rewards App</title>
<meta name="theme-color" content="#150f33" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  html, body { margin:0; padding:0; height:100%; font-family:sans-serif; background:#0e0b22; overflow-x:hidden; }
  #root:empty::after {
    content: "Loading…";
    display:flex; align-items:center; justify-content:center;
    height:100vh; color:#8a8fa3;
  }
  .err-box {
    padding:20px; margin:20px; background:#fee; border:2px solid #c00; border-radius:12px;
    color:#900; font-family:monospace; font-size:13px; white-space:pre-wrap; word-break:break-word;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  function showErr(msg){
    var root = document.getElementById('root');
    root.innerHTML = '<div class="err-box"><b>Something went wrong:</b>\n\n' + msg + '</div>';
  }
  window.onerror = function(msg, src, line, col, err){
    showErr(msg + '\n\nFile: ' + src + '\nLine: ' + line);
    return true;
  };
  // If nothing has rendered after 5 seconds, show a diagnostic checklist
  setTimeout(function(){
    var root = document.getElementById('root');
    if (!root.hasChildNodes()) {
      showErr(
        "App did not load after 5 seconds.\n\n" +
        "Checklist:\n" +
        "1. Open this URL directly and confirm it shows code (not 404):\n   " + location.href.replace(/\/$/, '') + "/app.js\n" +
        "2. Make sure index.html, app.js, manifest.json and the icons folder are ALL in the root of your repo (not inside a subfolder)\n" +
        "3. Try a hard refresh (pull down / Ctrl+Shift+R)\n" +
        "4. Check your internet connection (React loads from a CDN)"
      );
    }
  }, 5000);
</script>
<script src="https://cdn.tailwindcss.com" onerror="showErr('Failed to load Tailwind CSS from CDN. Check your internet connection.')"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" onerror="showErr('Failed to load React from CDN (unpkg.com). Check your internet connection or try a different network.')"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" onerror="showErr('Failed to load ReactDOM from CDN (unpkg.com). Check your internet connection or try a different network.')"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @keyframes popIn { 0% { opacity:0; transform: scale(0.9) translateY(10px);} 100% { opacity:1; transform: scale(1) translateY(0);} }
  @keyframes slideUp { 0% { opacity:0; transform: translateY(24px);} 100% { opacity:1; transform: translateY(0);} }
  @keyframes bounceDot { 0%,80%,100% { transform: translateY(0); opacity:0.5;} 40% { transform: translateY(-8px); opacity:1;} }
  @keyframes checkPop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .screen-enter { animation: slideUp 0.32s cubic-bezier(.2,.8,.2,1) both; }
  .card-enter { animation: popIn 0.28s cubic-bezier(.2,.8,.2,1) both; }
  .tap-scale { transition: transform .12s ease; }
  .tap-scale:active { transform: scale(0.94); }
  .dot { animation: bounceDot 1.2s infinite ease-in-out; }
  .check-pop { animation: checkPop .4s cubic-bezier(.34,1.56,.64,1) both; }
  .sora { font-family:'Sora',sans-serif; }
</style>
<script src="app.js" onerror="showErr('app.js was not found (404). This usually means the file was not uploaded to the root of your GitHub repo, or the filename/case does not match exactly.')"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
